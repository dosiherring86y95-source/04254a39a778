version: 2.1

jobs:
  windward:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load polar
          command: |
            printf 'twa 45\n' > sail.cfg
      - run:
          name: Build routing engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target windward -j2
      - run:
          name: Optimize windward leg
          command: LIONSS_LP=1 ./build/windward --config sail.cfg --tacks 6
  stm8_eeprom:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map EEPROM region
          command: |
            printf 'base 0x4000\n' > ee.map
      - run:
          name: Cross-compile driver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stm8_eeprom -j2
      - run:
          name: Program EEPROM
          command: LIONSS_LP=1 ./build/stm8_eeprom --map ee.map --verify
  timeTravelDebug:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load recording
          command: |
            : > session.rec
      - run:
          name: Build time-travel debugger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target timeTravelDebug -j2
      - run:
          name: Step backward
          command: LIONSS_LP=1 ./build/timeTravelDebug --rec session.rec --reverse
  jitProfile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed traces
          command: |
            printf 'hot 50\n' > jit.cfg
      - run:
          name: Build profiler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target jitProfile -j2
      - run:
          name: Profile hot methods
          command: LIONSS_LP=1 ./build/jitProfile --conf jit.cfg --threshold 10000
  gmres_restart:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load matrix
          command: |
            printf '3 1 1 3\n' > A.mtx
      - run:
          name: Build Krylov solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gmres_restart -j2
      - run:
          name: Solve with GMRES
          command: LIONSS_LP=1 ./build/gmres_restart --matrix A.mtx --restart 30
  Wrenfield:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load meadow
          command: |
            printf 'nests 30\n' > wren.cfg
      - run:
          name: Build habitat sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Wrenfield -j2
      - run:
          name: Survey wrenfield
          command: LIONSS_LP=1 ./build/Wrenfield --config wren.cfg --season spring
  flintlock:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load keyring
          command: |
            printf 'keys = 4\n' > flint.cfg
      - run:
          name: Build auth module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flintlock -j2
      - run:
          name: Rotate flintlock keys
          command: LIONSS_LP=1 ./build/flintlock --config flint.cfg --ttl 3600
  lut-grade:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Author LUT
          command: |
            printf 'size 33\n' > grade.cube
      - run:
          name: Build color grader
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target lut-grade -j2
      - run:
          name: Apply 3D LUT
          command: LIONSS_LP=1 ./build/lut-grade --lut grade.cube --strength 1.0
  walReplay:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Append WAL records
          command: |
            printf 'BEGIN\nSET k v\nCOMMIT\n' > wal.log
      - run:
          name: Build recovery engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target walReplay -j2
      - run:
          name: Replay write-ahead log
          command: LIONSS_LP=1 ./build/walReplay --wal wal.log --checkpoint 0
  aftermathDump:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load gpu crash
