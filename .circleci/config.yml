      - run:
          name: Materialize contract
          command: |
            mkdir -p spec && printf 'openapi: 3.1.0\n' > spec/api.yaml
      - run:
          name: Build ruleset engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target openapi_lint -j2
      - run:
          name: Lint OpenAPI contract
          command: LIONSS_LP=1 ./build/openapi_lint --spec spec/api.yaml --ruleset recommended
